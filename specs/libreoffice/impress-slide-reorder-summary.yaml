name: LibreOffice Impress slide reorder summary deep state
benchmark: LibreOffice
repo: ../../games/LibreOffice
target:
  kind: impress_presentation
  path: impress-slide-reorder-summary.odp
  slides:
    - title: Appendix Metrics
      bullets: [Raw detail follows]
    - title: Customer Impact
      bullets: [Pilot customers stable, Support tickets down]
    - title: Executive Summary
      bullets: [Draft summary, Needs final order]
    - title: Mitigation Plan
      bullets: [Owner matrix ready]
checkpoint:
  allowed_strategies: ["libreoffice_uno_document_validate"]
  expected_validity: save-restorable
actions:
  - type: libreoffice_move_slide
    from: 3
    to: 1
  - type: libreoffice_set_slide_title
    slide: 1
    title: Executive Summary - Final Brief
  - type: libreoffice_set_slide_bullets
    slide: 1
    bullets: [Customer impact stable, Mitigation owners assigned, Appendix moved to back]
  - type: libreoffice_save
  - type: libreoffice_reopen
assertions:
  - type: libreoffice_slide_count_equals
    expected: 4
  - type: libreoffice_slide_title_equals
    slide: 1
    expected: Executive Summary - Final Brief
  - type: libreoffice_slide_text_contains
    slide: 1
    text: Mitigation owners assigned
  - type: no_libreoffice_errors
visual_oracle:
  golden_image: visual/impress-slide-reorder-summary.after.golden.png
  golden_before: visual/impress-slide-reorder-summary.before.golden.png
  golden_after: visual/impress-slide-reorder-summary.after.golden.png
  expected_label: correct
  description: "A LibreOffice Impress deck is visible in draft order before the executive summary is moved to the front."
  rubric:
    must:
      - "LibreOffice Impress displays a multi-slide deck."
      - "Slide content or thumbnails are visible."
    must_not:
      - "A blank window, crash dialog, or unrelated app is shown."
    ignore:
      - "Selected slide, zoom, thumbnails, and toolbar differences."
  after_description: "After the workflow, the executive summary is the first slide and contains final brief bullets."
  after_rubric:
    must:
      - "LibreOffice Impress displays the deck."
      - "The visible first/active slide is an Executive Summary final brief or the thumbnails indicate it has moved forward."
      - "The deck is rendered normally."
    must_not:
      - "The appendix remains the first visible slide with no reordering evidence."
      - "The screenshot shows Writer/Calc, a blank window, or a crash."
    ignore:
      - "Exact selected slide, zoom, and toolbar differences."
  capture:
    stage: post_smoke
    active_slide: 1
    wait_ms: 500
    full_page: false
tags:
  - libreoffice
  - impress
  - deep-state
  - reorder
timeout_ms: 240000
