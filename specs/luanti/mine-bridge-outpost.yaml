name: luanti restore a mine bridge outpost with player kit
benchmark: "luanti"
timeout_ms: 360000
tags: ["luanti", "production", "mine", "bridge", "player"]
target:
  kind: synthesized_world
  fill:
    - from: { x: -1, y: 0, z: -1 }
      to: { x: 8, y: 0, z: 8 }
      node: "basenodes:gravel"
    - from: { x: 0, y: 1, z: 2 }
      to: { x: 7, y: 1, z: 4 }
      node: "basenodes:water_source"
    - from: { x: 1, y: 2, z: 3 }
      to: { x: 6, y: 2, z: 3 }
      node: "basenodes:tree"
    - from: { x: 0, y: 1, z: 7 }
      to: { x: 7, y: 4, z: 7 }
      node: "basenodes:stone"
    - from: { x: 2, y: 1, z: 6 }
      to: { x: 5, y: 3, z: 6 }
      node: "basenodes:cobble"
    - from: { x: 2, y: 5, z: 6 }
      to: { x: 5, y: 5, z: 7 }
      node: "stairs:slab_stone"
      param2: 0
  nodes:
    - pos: { x: 1, y: 3, z: 3 }
      node: "basenodes:tree"
    - pos: { x: 6, y: 3, z: 3 }
      node: "basenodes:tree"
    - pos: { x: 3, y: 2, z: 6 }
      node: "air"
    - pos: { x: 4, y: 2, z: 6 }
      node: "air"
  player:
    pos: { x: 1, y: 3, z: 0 }
    hp: 20
    inventory:
      - { item: "basetools:pick_steel", count: 1 }
      - { item: "basenodes:cobble", count: 32 }
  validations:
    - path: "inventory.basetools:pick_steel"
      expected: "1"
checkpoint:
  allowed_strategies: ["luanti_worldmod_state_validate"]
  expected_validity: "save-restorable"
actions:
  - type: luanti_set_player_pos
    pos: { x: 3, y: 3, z: 3 }
  - type: luanti_set_node
    pos: { x: 3, y: 2, z: 6 }
    node: "air"
  - type: luanti_set_node
    pos: { x: 4, y: 2, z: 6 }
    node: "air"
  - type: luanti_set_node
    pos: { x: 3, y: 2, z: 5 }
    node: "stairs:stair_cobble"
    param2: 0
assertions:
  - type: luanti_player_pos_near
    pos: { x: 3, y: 3, z: 3 }
    radius: 2.0
  - type: luanti_inventory_contains
    item: "basetools:pick_steel"
    count: 1
  - type: luanti_node_count
    from: { x: 1, y: 2, z: 3 }
    to: { x: 6, y: 2, z: 3 }
    node: "basenodes:tree"
    min_count: 6
  - type: luanti_node_count
    from: { x: 0, y: 1, z: 7 }
    to: { x: 7, y: 4, z: 7 }
    node: "basenodes:stone"
    min_count: 28
  - type: luanti_node_is
    pos: { x: 3, y: 2, z: 6 }
    expected: "air"
  - type: luanti_node_is
    pos: { x: 3, y: 2, z: 5 }
    expected: "stairs:stair_cobble"
  - type: no_luanti_mod_errors
visual_oracle:
  golden_image: visual/mine-bridge-outpost.golden.png
  golden_before: visual/luanti-mine-bridge-outpost.before.golden.png
  golden_after: visual/luanti-mine-bridge-outpost.after.golden.png
  expected_label: correct
  description: "A mining outpost with a wooden bridge, stone portal, water trench, and equipped player state is rendered in Luanti."
  rubric:
    must:
      - "A multi-block outpost or bridge structure is visible, not just one placed block."
      - "The scene suggests a bridge, trench, or mine entrance through grouped stone/wood blocks."
      - "No crash dialog, error overlay, main menu, or fully blank screen is shown."
    must_not:
      - "Only an empty flat world or a one-block smoke-test scene is visible."
      - "The screen is black, blank, or blocked by an error dialog."
    ignore:
      - "Exact player orientation, hotbar ordering, camera angle, lighting, or HUD."
  capture:
    stage: post_smoke
    wait_ms: 1000
    full_page: false
