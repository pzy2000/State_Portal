            item at the lower right, and the server and chat text lines along the
            top.
      buggy:
        after: visual_lz-luanti-9572-vector-rotate/buggy.after.golden.png
        after_description: 'The title bar is dark red and reads "C1 LAZARUS #9572
          ACTUAL VECTOR RESULT", and the body shows "DEFECT: VECTOR ROTATE MISSING"
          above "rotate type: nil", "rotation correct: false" and "vector.add invariant:
