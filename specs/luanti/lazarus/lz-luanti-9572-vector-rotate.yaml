  visual_oracle:
    golden_image: visual_lz-luanti-9572-vector-rotate/fixed.after.golden.png
    expected_label: correct
    description: 'The title bar is dark blue-grey and reads "C1 LAZARUS #9572 VECTOR
      ROTATE REPLAY", and the body reads "COMMON START", "Rotate (1,0,0) around Z
      by pi/2.", "Expected result: approximately (0,-1,0)" and "vector.add remains
      the invariant.".'
    rubric:
      must:
      - A Luanti client frame rendered by the candidate build shows a dark room behind
        a centred formspec panel with a coloured title bar, above an eight-slot hotbar.
      - 'The title bar is dark blue-grey and reads "C1 LAZARUS #9572 VECTOR ROTATE
        REPLAY", and the body reads "COMMON START", "Rotate (1,0,0) around Z by pi/2.",
        "Expected result: approximately (0,-1,0)" and "vector.add remains the invariant.".'
