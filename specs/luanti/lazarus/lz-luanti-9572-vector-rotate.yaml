      field: add_ok
      expected: true
    - type: luanti_lazarus_state_audit
      field: rotate_ok
      expected: false
    - type: luanti_lazarus_state_audit
      field: rotate_type
      expected: nil
    invariant_checks:
    - type: no_luanti_mod_errors
    upstream_tests:
      fail_to_pass:
      - vector rotate()
      - vector rotate() rotates
      pass_to_pass:
      - vector add()
      per_trial_p2p:
