            wall.
          - The dialog is gone and every wall, floor and ceiling surface in view is
            tiled with the override mod's green texture, a bright green grid on a
            dark green background, with no red tiling on those surfaces.
          must_not:
          - A blank frame, a crash dialog, or an unrelated application screen is shown.
          ignore:
