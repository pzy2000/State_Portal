        after_description: The dialog is gone and every wall, floor and ceiling surface
          in view is tiled with the override mod's green texture, a bright green grid
          on a dark green background, with no red tiling on those surfaces.
        after_rubric:
          must:
          - A Luanti client frame rendered by the candidate build shows the player
