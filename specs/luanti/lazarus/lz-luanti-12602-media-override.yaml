          checks: []
        goal:
          use_assertions: true
          checks: []
      state:
        adapter: luanti_lazarus_frozen_evidence_v1
        start:
          validate_target: true
          checks: []
        goal:
          use_assertions: true
          checks: []
  visual_oracle:
    golden_image: visual_lz-luanti-12602-media-override/fixed.after.golden.png
    expected_label: correct
    description: 'No tiled texture covers the room yet: the view is a flat dark blue-grey
      background behind a centred dialog titled "C1 LAZARUS  #12602  MEDIA OVERRIDE
      REPLAY" whose body reads "COMMON START", "Two ordered mods provide the same
      texture filename.", "The later override mod must win." and "Waiting for the
      registered replay ...".'
    rubric:
      must:
      - A Luanti client frame rendered by the candidate build shows the player inside
        a closed room of display nodes, looking straight ahead at the far wall.
      - 'No tiled texture covers the room yet: the view is a flat dark blue-grey background
        behind a centred dialog titled "C1 LAZARUS  #12602  MEDIA OVERRIDE REPLAY"
        whose body reads "COMMON START", "Two ordered mods provide the same texture
        filename.", "The later override mod must win." and "Waiting for the registered
        replay ...".'
      must_not:
      - A blank frame, a crash dialog, or an unrelated application screen is shown.
      ignore:
      - The green slab at the lower right, the hotbar row, the crosshair, the node
        selection outline, and the server and chat text lines along the top.
    capture:
      stage: post_smoke
      wait_ms: 1000
      full_page: false
  lazarus:
    schema_version: 1
    goal_checks:
    - type: luanti_lazarus_state_audit
