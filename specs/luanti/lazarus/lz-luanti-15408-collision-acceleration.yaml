actions: []
evaluation:
  schema_version: 1
  semantic:
    assertions: []
    surfaces:
      gui:
        adapter: luanti_lazarus_frozen_evidence_v1
        start:
          validate_target: true
          checks: []
        goal:
          use_assertions: true
          checks: []
      state:
        adapter: luanti_lazarus_frozen_evidence_v1
        start:
          validate_target: true
          checks: []
        goal:
          use_assertions: true
          checks: []
  visual_oracle:
    golden_image: visual_lz-luanti-15408-collision-acceleration/fixed.after.golden.png
    expected_label: correct
    description: The cube rests to the right of the pillar with a clear gap between
      them, and a small purple marker is visible on the platform inside that gap.
    rubric:
      must:
      - A Luanti client frame rendered by the candidate build shows a small stone
        platform floating in a pale blue sky, carrying a tall cobblestone pillar and
        one white-and-grey cube entity.
      - The cube rests to the right of the pillar with a clear gap between them, and
        a small purple marker is visible on the platform inside that gap.
      must_not:
      - A blank frame, a crash dialog, or an unrelated application screen is shown.
      ignore:
      - The hotbar row, the crosshair, the coloured cloud band on the right, and the
        exact sky gradient.
    capture:
      stage: post_smoke
      wait_ms: 1000
      full_page: false
  lazarus:
    schema_version: 1
    goal_checks:
    - type: luanti_lazarus_state_audit
      field: collides
      expected: false
    - type: luanti_lazarus_state_audit
      field: collision_count
      expected: 0
    - type: luanti_lazarus_state_audit
      field: vx
      expected: 10.0
    - type: luanti_lazarus_state_audit
      field: vy
      expected: 0.0
    - type: luanti_lazarus_state_audit
      field: x
      expected: 0.0
    - type: luanti_lazarus_state_audit
      field: y
      expected: 2.0
    defect_signature:
    - type: luanti_lazarus_state_audit
      field: collides
      expected: false
    - type: luanti_lazarus_state_audit
      field: collision_count
      expected: 0
    - type: luanti_lazarus_state_audit
      field: vx
      expected: 10.0
    - type: luanti_lazarus_state_audit
      field: vy
      expected: 0.0
    - type: luanti_lazarus_state_audit
      field: x
      expected: 5.0
    - type: luanti_lazarus_state_audit
      field: y
      expected: 2.0
    invariant_checks:
    - type: no_luanti_mod_errors
    upstream_tests:
      fail_to_pass:
      - TestCollision
      pass_to_pass:
      - TestSettings
      per_trial_p2p:
      - TestSettings
    goldens:
      before: visual_lz-luanti-15408-collision-acceleration/before.golden.png
      buggy_before: visual_lz-luanti-15408-collision-acceleration/buggy.before.golden.png
      fixed:
        after: visual_lz-luanti-15408-collision-acceleration/fixed.after.golden.png
        after_description: The cube has moved left and now rests directly against
          the right side of the pillar, covering the purple marker, and no part of
          the cube is on the left side of the pillar.
        after_rubric:
          must:
          - A Luanti client frame rendered by the candidate build shows a small stone
            platform floating in a pale blue sky, carrying a tall cobblestone pillar
            and one white-and-grey cube entity.
          - The cube has moved left and now rests directly against the right side
            of the pillar, covering the purple marker, and no part of the cube is
            on the left side of the pillar.
          must_not:
          - A blank frame, a crash dialog, or an unrelated application screen is shown.
          ignore:
          - The hotbar row, the crosshair, the coloured cloud band on the right, and
            the exact sky gradient.
      buggy:
        after: visual_lz-luanti-15408-collision-acceleration/buggy.after.golden.png
        after_description: The cube has passed through the pillar and now rests on
          its left side, overlapping the pillar's base, while the purple marker is
          visible again on the empty right side.
        after_rubric:
          must:
          - A Luanti client frame rendered by the candidate build shows a small stone
            platform floating in a pale blue sky, carrying a tall cobblestone pillar
            and one white-and-grey cube entity.
          - The cube has passed through the pillar and now rests on its left side,
            overlapping the pillar's base, while the purple marker is visible again
            on the empty right side.
          must_not:
          - A blank frame, a crash dialog, or an unrelated application screen is shown.
          ignore:
          - The hotbar row, the crosshair, the coloured cloud band on the right, and
            the exact sky gradient.
