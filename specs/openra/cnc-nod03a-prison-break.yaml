name: OpenRA C&C Nod prison break map checkpoint
benchmark: OpenRA
repo: ../../games/OpenRA
tags: ["openra", "cnc", "campaign", "nod"]
target:
  kind: openra_map
  mod: cnc
  requires_mod: cnc
  map: nod03a
  title: "03a: Sudanese Prison Break"
  visibility: MissionSelector
  categories: ["Campaign"]
  players:
    - id: Nod
      playable: true
      required: true
      faction: nod
    - id: GDI
      bot: campaign
      faction: gdi
  actors:
    - type: jeep
      owner: GDI
      min_count: 2
    - type: e1
      owner: GDI
      min_count: 7
  objectives:
    - owner: Nod
      type: primary
      id: capture-prison
    - owner: Nod
      type: secondary
      id: destroy-gdi-forces
checkpoint:
  allowed_strategies: ["openra_utility_map_validate"]
  expected_validity: replay-reachable
replay_from_start:
  actions:
    - type: openra_launch_map
      mod: cnc
      map: nod03a
actions:
  - type: openra_validate_map
    mod: cnc
    map: nod03a
assertions:
  - type: openra_map_loaded
    mod: cnc
    map: nod03a
  - type: openra_player_exists
    id: Nod
    playable: true
    faction: nod
  - type: openra_actor_count
    actor: jeep
    owner: GDI
    min_count: 2
  - type: openra_objective_declared
    owner: Nod
    objective_type: primary
    objective: capture-prison
  - type: no_openra_utility_errors
visual_oracle:
  golden_image: visual/cnc-nod03a-prison-break.golden.png
  golden_before: visual/cnc-nod03a-prison-break.before.golden.png
  golden_after: visual/cnc-nod03a-prison-break.after.golden.png
  expected_label: correct
  description: "The OpenRA C&C nod03a prison-break mission has launched into the live in-game RTS world."
  rubric:
    must:
      - "The live OpenRA in-game world is visible after launching cnc/nod03a."
      - "The screenshot contains rendered terrain plus gameplay UI such as sidebar, minimap, command bar, or selection/status panels."
      - "The game surface is non-blank and looks like an active RTS scene rather than a static asset file."
    must_not:
      - "The screenshot is blank, a crash log, or an unrelated application."
      - "The screenshot shows only a standalone packaged map image instead of the live OpenRA UI."
      - "The screenshot is stuck on the main menu, mission browser, or setup dialog."
    ignore:
      - "Small camera, animation, cursor, or UI timing differences after the clean map launch."
  capture:
    stage: post_smoke
    wait_ms: 0
    full_page: false
