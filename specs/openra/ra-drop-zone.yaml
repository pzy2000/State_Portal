name: OpenRA RA Drop Zone lobby checkpoint
benchmark: OpenRA
repo: ../../games/OpenRA
tags: ["openra", "ra", "lobby", "drop-zone"]
target:
  kind: openra_map
  mod: ra
  requires_mod: ra
  map: drop-zone
  title: Drop Zone
  visibility: Lobby
  categories: ["Drop Zone"]
  players:
    - id: Multi0
      playable: true
      faction: soviet
    - id: Multi7
      playable: true
      faction: soviet
  actors:
    - type: apc
      min_count: 8
    - type: mpspawn
      owner: Neutral
      min_count: 8
checkpoint:
  allowed_strategies: ["openra_utility_map_validate"]
  expected_validity: replay-reachable
replay_from_start:
  actions:
    - type: openra_launch_map
      mod: ra
      map: drop-zone
actions:
  - type: openra_validate_map
    mod: ra
    map: drop-zone
assertions:
  - type: openra_map_loaded
    mod: ra
    map: drop-zone
  - type: openra_player_exists
    id: Multi0
    playable: true
    faction: soviet
  - type: openra_actor_count
    actor: apc
    min_count: 8
  - type: openra_actor_count
    actor: mpspawn
    owner: Neutral
    min_count: 8
  - type: no_openra_utility_errors
visual_oracle:
  golden_image: visual/ra-drop-zone.golden.png
  golden_before: visual/ra-drop-zone.before.golden.png
  golden_after: visual/ra-drop-zone.after.golden.png
  expected_label: correct
  description: "The OpenRA Red Alert drop-zone map has launched into the live in-game RTS world."
  rubric:
    must:
      - "The live OpenRA in-game world is visible after launching ra/drop-zone."
      - "The screenshot contains rendered terrain plus gameplay UI such as sidebar, minimap, command bar, or selection/status panels."
      - "The game surface is non-blank and looks like an active RTS scene rather than a static asset file."
    must_not:
      - "The screenshot is blank, a crash log, or an unrelated application."
      - "The screenshot shows only a standalone packaged map image instead of the live OpenRA UI."
      - "The screenshot is stuck on the main menu, mission browser, lobby, or setup dialog."
    ignore:
      - "Small camera, animation, cursor, or UI timing differences after the clean map launch."
  capture:
    stage: post_smoke
    wait_ms: 0
    full_page: false
