name: OpenRA C&C GDI beachhead map checkpoint
benchmark: OpenRA
repo: ../../games/OpenRA
tags: ["openra", "cnc", "campaign", "gdi"]
target:
  kind: openra_map
  mod: cnc
  requires_mod: cnc
  map: gdi01
  title: "01:   Storm the Beachhead"
  visibility: MissionSelector
  categories: ["Campaign"]
  players:
    - id: GDI
      playable: true
      required: true
      faction: gdi
    - id: Nod
      bot: campaign
      faction: nod
  actors:
    - type: e1
      owner: Nod
      min_count: 10
    - type: gun
      owner: Nod
      min_count: 3
  objectives:
    - owner: GDI
      type: primary
      id: eliminate-nod
    - owner: GDI
      type: secondary
      id: establish-beachhead
checkpoint:
  allowed_strategies: ["openra_utility_map_validate"]
  expected_validity: replay-reachable
replay_from_start:
  actions:
    - type: openra_launch_map
      mod: cnc
      map: gdi01
actions:
  - type: openra_validate_map
    mod: cnc
    map: gdi01
assertions:
  - type: openra_map_loaded
    mod: cnc
    map: gdi01
  - type: openra_player_exists
    id: GDI
    playable: true
    faction: gdi
  - type: openra_actor_count
    actor: e1
    owner: Nod
    min_count: 10
  - type: openra_objective_declared
    owner: GDI
    objective_type: primary
    objective: eliminate-nod
  - type: no_openra_utility_errors
visual_oracle:
  golden_image: visual/cnc-gdi01-beachhead.golden.png
  golden_before: visual/cnc-gdi01-beachhead.before.golden.png
  golden_after: visual/cnc-gdi01-beachhead.after.golden.png
  expected_label: correct
  description: "The OpenRA C&C gdi01 beachhead mission has launched into the live in-game RTS world."
  rubric:
    must:
      - "The live OpenRA in-game world is visible after launching cnc/gdi01."
      - "The screenshot contains rendered terrain plus gameplay UI such as sidebar, minimap, command bar, or selection/status panels."
      - "The game surface is non-blank and looks like an active RTS scene rather than a static asset file."
    must_not:
      - "The screenshot is blank, a crash log, or an unrelated application."
      - "The screenshot shows only a standalone packaged map image instead of the live OpenRA UI."
      - "The screenshot is stuck on the main menu, mission browser, or setup dialog."
    ignore:
      - "Small camera, animation, cursor, or UI timing differences after the clean map launch."
  capture:
    stage: post_smoke
    wait_ms: 0
    full_page: false
