    description: A live OpenRA map editor is visible, not the main menu or a loading/error screen. The
      tile-template palette is not displaying a populated template listing yet. A different palette, such
      as overlays, may be open. Search/Filter controls identifying a populated tile-template listing are
      not a valid pre-transition Start.
    rubric:
      must:
      - A live OpenRA map editor is visible, not the main menu or a loading/error screen.
      - The tile-template palette is not displaying a populated template listing yet. A different palette,
        such as overlays, may be open. Search/Filter controls identifying a populated tile-template listing
        are not a valid pre-transition Start.
      must_not:
      - A blank page, an error overlay, or an unrelated application screen is shown.
      ignore:
      - Window chrome, font antialiasing, and cursor blink.
      - Map identity, terrain arrangement, camera position, minimap contents, resource counts, viewport
        size and UI scale. These are not specified by the public Start condition.
      - Content of the non-tile palette (for example overlay icons) and unrelated editor toolbar layout.
        Do not ignore whether the tile-template listing is already populated.
