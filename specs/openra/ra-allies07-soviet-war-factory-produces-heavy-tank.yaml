name: OpenRA RA Allies Sunken Treasure Soviet war factory heavy tank checkpoint
benchmark: OpenRA
repo: ../../games/OpenRA
tags: ["openra", "ra", "campaign", "allies", "soviet", "production", "vehicle"]
timeout_ms: 180000
setup:
  openra_gameplay_probe:
    cash: 50000
    fast_build: true
    build_anywhere: false
target:
  kind: openra_map
  mod: ra
  requires_mod: ra
  map: allies-07
  title: "07:   Sunken Treasure"
  visibility: MissionSelector
  categories: ["Campaign"]
  players:
    - id: Greece
      playable: true
      required: true
      faction: allies
    - id: USSR
      bot: campaign
      faction: soviet
  actors:
    - id: USSRWarFactory
      type: weap
      owner: USSR
checkpoint:
  allowed_strategies: ["openra_gameplay_production_validate"]
  expected_validity: replay-reachable
replay_from_start:
  actions:
    - type: openra_launch_map
      mod: ra
      map: allies-07
actions:
  - type: openra_wait_ticks
    ticks: 20
  - type: openra_build_actor
    player: USSR
    actor: 3tnk
    queue: Vehicle
    timeout_ticks: 900
assertions:
  - type: openra_actor_exists
    player: USSR
    actor_id: USSRWarFactory
  - type: openra_actor_built
    player: USSR
    actor: 3tnk
    min_delta: 1
  - type: openra_production_prerequisite_respected
    player: USSR
    actor: 3tnk
  - type: no_openra_gameplay_probe_errors
visual_oracle:
  golden_image: visual/ra-allies07-war-factory.golden.png
  golden_before: visual/ra-allies07-soviet-war-factory-produces-heavy-tank.before.golden.png
  golden_after: visual/ra-allies07-soviet-war-factory-produces-heavy-tank.after.golden.png
  expected_label: correct
  description: "The OpenRA Red Alert allies-07 Sunken Treasure mission has launched into the live in-game RTS world."
  rubric:
    must:
      - "The live OpenRA in-game world is visible after launching ra/allies-07."
      - "The screenshot contains rendered terrain plus gameplay UI such as sidebar, minimap, command bar, or selection/status panels."
      - "The game surface is non-blank and looks like an active RTS scene rather than a static asset file."
    must_not:
      - "The screenshot is blank, a crash log, or an unrelated application."
      - "The screenshot shows only a standalone packaged map image instead of the live OpenRA UI."
      - "The screenshot is stuck on the main menu, mission browser, or setup dialog."
    ignore:
      - "Small camera, animation, cursor, or UI timing differences after the clean map launch."
  capture:
    stage: post_smoke
    wait_ms: 0
    full_page: false
