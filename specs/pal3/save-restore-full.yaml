name: pal3 full state survives save and restore
benchmark: "pal3"
timeout_ms: 900000
tags: ["pal3", "save", "restore"]
target:
  kind: synthesized_state
  scene_city: "q01"
  scene_name: "b"
  money: 1000
  team_ids: [0, 1]
  story_vars:
    - key: 32768
      value: 10401
checkpoint:
  allowed_strategies: ["pal3_console_save_validate"]
  expected_validity: "save-restorable"
actions:
  - type: pal3_save
    save_index: 0
  - type: pal3_load_save
    save_index: 0
assertions:
  - type: pal3_money_gte
    int_value: 1000
  - type: pal3_team_count
    expected: "2"
  - type: pal3_story_var_equals
    var_id: 32768
    expected: "10401"
  - type: no_pal3_utility_errors

visual_oracle:
  golden_image: visual/save-restore-full.golden.png
  expected_label: correct
  scene_key: pal3_q01_b
  description: "A PAL3 Unity 3D game scene is rendered after the checkpoint and smoke actions complete. The visual oracle checks that the game reached a real rendered frame without requiring internal semantic state to be visible in the screenshot."
  rubric:
    must:
      - "A PAL3 Unity 3D scene or in-game camera view is rendered and visible."
      - "The frame contains visible game content with non-flat color and detail."
      - "No crash dialog, exception overlay, or fully blank screen is shown."
    must_not:
      - "The screenshot is blank, black, or only a single flat color."
      - "The screenshot shows only the Unity splash screen, editor UI, or a loading-only frame."
      - "An error dialog or exception stack trace is visible."
    ignore:
      - "Exact camera angle, lighting, animation frame, or HUD layout differences."
      - "Internal state changes such as inventory, money, favor, script variables, or save-slot contents that are validated semantically."
      - "Small character or prop position differences within the same rendered PAL3 scene."
  capture:
    stage: post_smoke
    wait_ms: 1000
    full_page: false
