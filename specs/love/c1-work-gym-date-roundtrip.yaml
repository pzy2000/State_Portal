name: C1 DatingSim work gym spa date roundtrip
benchmark: datingsim
tags: [love, c1, deep-chain, roundtrip, no-openai]
setup: {ai_mode: mocked}
target:
  kind: deterministic_state
  player_name: WarpTest
  gender: male
  patch:
    player:
      resources: {money: 1000, energy: 100}
      stats: {intelligence: 10, strength: 10, charm: 10, communication: 10, creativity: 10, luck: 10}
    world: {location: home, week: 1, day: 0, timeSlot: morning}
  expect:
    location: home
    resources: {money: 1000, energy: 100}
checkpoint:
  allowed_strategies: [test_hook_seeded_state]
  expected_validity: save-restorable
actions:
  - {type: hook_action, action_id: work_coding, wait_ms: 250}
  - {type: hook_call, method: patchState, args: [{world: {location: gym}}], wait_ms: 150}
  - {type: hook_action, action_id: gym_workout, wait_ms: 250}
  - {type: hook_action, action_id: spa_visit, wait_ms: 250}
  - {type: hook_call, method: patchState, args: [{world: {location: cafe, timeSlot: afternoon}}], wait_ms: 150}
  - {type: hook_action, action_id: date_coffee, wait_ms: 300}
  - {type: hook_call, method: save, args: [], wait_ms: 200}
  - {type: hook_call, method: load, args: [], wait_ms: 500}
evaluation:
  schema_version: 1
  semantic:
    assertions:
      - {type: state_equals, path: player.resources.money, value: 960}
      - {type: state_equals, path: player.resources.energy, value: 90}
      - {type: state_equals, path: player.stats.intelligence, value: 11}
      - {type: state_equals, path: player.stats.strength, value: 12}
      - {type: state_equals, path: player.stats.charm, value: 11}
      - {type: state_equals, path: player.stats.communication, value: 11}
      - {type: state_equals, path: world.location, value: cafe}
      - {type: no_real_openai}
      - {type: no_severe_console}
    surfaces:
      gui:
        adapter: love_production_save_roundtrip_v1
        start:
          validate_target: true
          checks:
          - name: probe.semantic_observation_error
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: semantic_observation_error
            expected:
              value: null
          - name: screen.gameplay
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: dom.screen
            expected:
              value: gameplay
          - name: state.isSetupComplete
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: state.isSetupComplete
            expected:
              value: true
          - name: state.player.name
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: state.player.name
            expected:
              value: WarpTest
          - name: state.player.gender
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: state.player.gender
            expected:
              value: male
          - name: dom.player_name
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: dom.player_name
            expected:
              value: WarpTest
          - name: dom.app_visible
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: dom.app_visible
            expected:
              value: true
          - name: dom.dashboard_visible
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: dom.dashboard_visible
            expected:
              value: true
          - name: dom.location_panel_visible
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: dom.location_panel_visible
            expected:
              value: true
          - name: dom.action_grid_visible
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: dom.action_grid_visible
            expected:
              value: true
          - name: state.player.resources.money
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: state.player.resources.money
            expected:
              value: 1000
          - name: state.player.resources.energy
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: state.player.resources.energy
            expected:
              value: 100
          - name: state.world.location
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: state.world.location
            expected:
              value: home
          - name: dom.active_location_index
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: dom.active_location_index
            expected:
              value: 0
          - name: dom.target_action_present
            metric: equals
            actual:
              probe: love.target_action_present
              path: dom.action_buttons.0
            expected:
              value: true
          - name: dom.target_action_enabled
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: dom.action_buttons.0.disabled
            expected:
              value: false
          - name: dom.target_action_visible
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: dom.action_buttons.0.visible
            expected:
              value: true
          - name: environment.ai_query_mode
            metric: equals
            actual:
              probe: common.path
              phase: current
              path: dom.ai_query_mode
            expected:
              value: mocked
        goal:
          use_assertions: true
          checks:
          - name: transition.target_action_count
            metric: equals
            actual:
              probe: love.target_action_count
              action_id: work_coding
            expected:
              value: 1
          - name: transition.new_log_entries
            metric: equals
            actual:
              probe: love.new_log_entries
            expected:
              value: 1
      state:
        adapter: love_state_profile_v1
        start:
          validate_target: true
          checks: []
        goal:
          use_assertions: true
          checks: []
  visual_oracle:
    golden_image: visual/love-work-gym-date-roundtrip.after.golden.png
    golden_before: visual/love-work-gym-date-roundtrip.before.golden.png
    golden_after: visual/love-work-gym-date-roundtrip.after.golden.png
    expected_label: correct
    description: "DatingSim is visible at home before the registered daily loop."
    after_description: "The cafe screen and updated player resources and attributes are visible after save/reload."
    rubric:
      must: ["The DatingSim game UI and WarpTest identity are visible.", "The home or daily-action UI is rendered."]
      must_not: ["The setup page, a real API error, or a blank page is visible."]
      ignore: ["Minor event-modal and animation differences."]
    after_rubric:
      must: ["The DatingSim game UI remains usable.", "The cafe or date context and updated status panel are visible."]
      must_not: ["A real AI/API error, setup page, or crash is visible."]
      ignore: ["Exact random-event text; semantic assertions verify resources and stats."]
    capture: {stage: post_smoke, wait_ms: 300, full_page: false, hide_selectors: [".modal-overlay:has(.event-title)"]}
