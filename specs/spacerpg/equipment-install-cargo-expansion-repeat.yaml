name: SpaceRPG repeated cargo expansion install checkpoint
benchmark: SpaceRPG
tags:
- spacerpg
- equipment
- loadout
- variant
setup:
  disable_economy_backend: true
target:
  kind: equipment_loadout
  screen: station
  system_id: helion-reach
  station_id: helion-prime
  station_tab: Hangar
  equipment_inventory:
    cargo-expansion: 1
checkpoint:
  allowed_strategies:
  - test_hook_jump_and_validate
  expected_validity: injection-only
actions:
- type: hook_call
  method: installEquipmentFromInventory
  args:
  - cargo-expansion
- type: wait
  ms: 250
assertions:
- type: state_contains
  path: player.equipment
  value: cargo-expansion
- type: state_equals
  path: player.equipmentInventory.cargo-expansion
  value: 0
- type: no_severe_console
visual_oracle:
  golden_image: visual/equipment-loadout.golden.png
  expected_label: correct
  description: The SpaceRPG equipment loadout remains usable after installing inventory
    equipment.
  rubric:
    must:
    - The relevant game UI is visible.
    - The page is not blank or crashed.
    must_not:
    - A browser error, crash overlay, or blank page is visible.
    - The screenshot shows an unrelated app or setup screen.
    ignore:
    - Minor animation, text wrapping, or dynamic UI differences.
  capture:
    stage: post_smoke
    wait_ms: 300
    full_page: false
