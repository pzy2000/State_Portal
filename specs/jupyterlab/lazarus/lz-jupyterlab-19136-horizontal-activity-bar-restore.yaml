name: C1-Lazarus JupyterLab 19136-horizontal-activity-bar-restore
benchmark: jupyterlab
timeout_ms: 900000
tags:
- c1
- lazarus
- jupyterlab
- production
setup:
  jupyterlab_lazarus_probe:
    task_id: lz-jupyterlab-19136-horizontal-activity-bar-restore
    change_number: 19136
    issue_number: 19114
    adapter: jupyterlab_lazarus_edge_probe_v1
    registered_replay:
    - load_candidate_local_bundle
    - build_a_shell_with_a_horizontal_activity_bar_and_a_right_widget
    - save_the_layout_with_the_candidate_shell
    - restore_a_second_shell_with_an_explicit_not_collapsed_flag
    - restore_a_second_shell_from_the_candidate_saved_layout
    - measure_right_area_visibility_and_width
    probe_executable: true
target:
  kind: jupyterlab_lazarus_candidate_bundle
  change_number: 19136
  variants:
  - fixed
  - buggy
  bundler: candidate_local_rspack
  browser: microsoft_edge_via_playwright
checkpoint:
  allowed_strategies:
  - jupyterlab_lazarus_edge_replay_validate
  expected_validity: replay-reachable
actions: []
evaluation:
  schema_version: 1
  semantic:
    assertions: []
    surfaces:
      gui:
        adapter: jupyterlab_lazarus_edge_probe_v1
        start:
          validate_target: true
          checks: []
        goal:
          use_assertions: true
          checks: []
      state:
        adapter: jupyterlab_lazarus_edge_probe_v1
        start:
          validate_target: true
          checks: []
        goal:
          use_assertions: true
          checks: []
  visual_oracle:
    golden_image: visual_lz-jupyterlab-19136-horizontal-activity-bar-restore/fixed.after.golden.png
    expected_label: correct
    description: A vertical border about three quarters across the frame bounds the
      main dock area, and the side area beyond it carries a grey "Property Inspector"
      tab at the bottom right.
    rubric:
      must:
      - A browser frame rendered by the candidate build shows a mostly white JupyterLab
        shell with a thin horizontal rule near the top and a small blue dot at the
        top left corner.
      - A vertical border about three quarters across the frame bounds the main dock
        area, and the side area beyond it carries a grey "Property Inspector" tab
        at the bottom right.
      must_not:
      - A blank page, an error overlay, or an unrelated application screen is shown.
      ignore:
      - Font antialiasing, caret blink, scrollbar rendering, and window chrome.
    capture:
      stage: post_smoke
      wait_ms: 1000
      full_page: false
  lazarus:
    schema_version: 1
    goal_checks:
    - type: jupyterlab_lazarus_dom_audit
      field: restored_area_hidden
      expected: false
    - type: jupyterlab_lazarus_dom_audit
      field: restored_area_width_is_zero
      expected: false
    - type: jupyterlab_lazarus_dom_audit
      field: restored_right_collapsed
      expected: true
    - type: jupyterlab_lazarus_dom_audit
      field: restored_side_bar_hidden
      expected: false
    - type: jupyterlab_lazarus_dom_audit
      field: saved_collapsed
      expected: false
    defect_signature:
    - type: jupyterlab_lazarus_dom_audit
      field: restored_area_hidden
      expected: true
    - type: jupyterlab_lazarus_dom_audit
      field: restored_area_width_is_zero
      expected: true
    - type: jupyterlab_lazarus_dom_audit
      field: restored_right_collapsed
      expected: true
    - type: jupyterlab_lazarus_dom_audit
      field: restored_side_bar_hidden
      expected: false
    - type: jupyterlab_lazarus_dom_audit
      field: saved_collapsed
      expected: true
    invariant_checks:
    - type: no_jupyterlab_probe_errors
    upstream_tests:
      fail_to_pass:
      - 'LabShell #activityBarPosition should restore a horizontal right activity
        bar with no current widget'
      pass_to_pass: &id001
      - 'LabShell #activityBarPosition should report the collapsed state via rightCollapsed
        in horizontal mode'
      per_trial_p2p: *id001
    goldens:
      before: visual_lz-jupyterlab-19136-horizontal-activity-bar-restore/before.golden.png
      buggy_before: visual_lz-jupyterlab-19136-horizontal-activity-bar-restore/buggy.before.golden.png
      fixed:
        after: visual_lz-jupyterlab-19136-horizontal-activity-bar-restore/fixed.after.golden.png
        after_description: A vertical border about three quarters across the frame
          bounds the main dock area, and the side area beyond it carries a grey "Property
          Inspector" tab at the bottom right.
        after_rubric:
          must:
          - A browser frame rendered by the candidate build shows a mostly white JupyterLab
            shell with a thin horizontal rule near the top and a small blue dot at
            the top left corner.
          - A vertical border about three quarters across the frame bounds the main
            dock area, and the side area beyond it carries a grey "Property Inspector"
            tab at the bottom right.
          must_not:
          - A blank page, an error overlay, or an unrelated application screen is
            shown.
          ignore:
          - Font antialiasing, caret blink, scrollbar rendering, and window chrome.
      buggy:
        after: visual_lz-jupyterlab-19136-horizontal-activity-bar-restore/buggy.after.golden.png
        after_description: 'No vertical border and no side area are drawn: the horizontal
          rule runs the full frame width and the right-hand side is empty white with
          no "Property Inspector" tab.'
        after_rubric:
          must:
          - A browser frame rendered by the candidate build shows a mostly white JupyterLab
            shell with a thin horizontal rule near the top and a small blue dot at
            the top left corner.
          - 'No vertical border and no side area are drawn: the horizontal rule runs
            the full frame width and the right-hand side is empty white with no "Property
            Inspector" tab.'
          must_not:
          - A blank page, an error overlay, or an unrelated application screen is
            shown.
          ignore:
          - Font antialiasing, caret blink, scrollbar rendering, and window chrome.
