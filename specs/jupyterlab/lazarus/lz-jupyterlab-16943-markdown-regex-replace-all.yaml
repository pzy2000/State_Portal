name: C1-Lazarus Jupyterlab 16943-markdown-regex-replace-all
benchmark: jupyterlab
timeout_ms: 900000
tags:
- c1
- lazarus
- jupyterlab
- production
setup:
  jupyterlab_lazarus_probe:
    task_id: lz-jupyterlab-16943-markdown-regex-replace-all
    change_number: 16943
    issue_number: 16925
    adapter: jupyterlab_lazarus_app_probe_v1
    observation_source: live_materialized_replay
    registered_replay:
    - load_materialized_dev_mode_bundle
    - restore_registered_search_start
    - apply_registered_replace_all
    - read_markdown_cell_text
    probe_executable: true
target:
  kind: jupyterlab_lazarus_application
  variants:
  - fixed
  - buggy
  bundler: materialized_dev_mode_bundle
  browser: chromium_via_playwright
  change_number: 16943
checkpoint:
  allowed_strategies:
  - jupyterlab_lazarus_app_replay_validate
  expected_validity: replay-reachable
actions: []
evaluation:
  schema_version: 1
  semantic:
    assertions: []
    surfaces:
      gui:
        adapter: jupyterlab_lazarus_app_probe_v1
        start:
          validate_target: true
          checks: []
        goal:
          use_assertions: true
          checks: []
      state:
        adapter: jupyterlab_lazarus_app_probe_v1
        start:
          validate_target: true
          checks: []
        goal:
          use_assertions: true
          checks: []
  visual_oracle:
    golden_image: visual_lz-jupyterlab-16943-markdown-regex-replace-all/fixed.after.golden.png
    expected_label: correct
    description: The markdown cell lists eight bullet items whose values are plain digit runs,
      and the search overlay shows the digit-capturing pattern and its substitution.
    rubric:
      must:
      - A JupyterLab notebook window shows a markdown cell headed "Lazarus replace-all fixture"
        above one code cell, with the document search overlay open at the top right.
      - Each of the eight bullet items reads name= followed by a three-digit number and nothing
        else.
      must_not:
      - A blank page, an error overlay, or an unrelated application screen is shown.
      ignore:
      - Font antialiasing, caret blink, scrollbar rendering, window chrome, and the file browser's
        relative modification times.
    capture:
      stage: post_smoke
      wait_ms: 1000
      full_page: false
  lazarus:
    schema_version: 1
    goal_checks:
    - type: jupyterlab_lazarus_app_audit
      field: regex_replace_state
      expected: backreference_expanded
    defect_signature:
    - type: jupyterlab_lazarus_app_audit
      field: regex_replace_state
      expected: backreference_literal
    invariant_checks:
    - type: no_jupyterlab_probe_errors
    upstream_tests:
      fail_to_pass:
      - jupyterlab-16943-regex-replace-all-f2p
      pass_to_pass:
      - jupyterlab-notebook-replace-all-construction-p2p
      - jupyterlab-coreutils-path-trial-p2p
      per_trial_p2p:
      - jupyterlab-coreutils-path-trial-p2p
    goldens:
      before: visual_lz-jupyterlab-16943-markdown-regex-replace-all/before.golden.png
      buggy_before: visual_lz-jupyterlab-16943-markdown-regex-replace-all/buggy.before.golden.png
      fixed:
        after: visual_lz-jupyterlab-16943-markdown-regex-replace-all/fixed.after.golden.png
        after_description: Every bullet item reads name= followed by its original three-digit
          number, then a plus sign and a one, so each captured run of digits was carried into
          the substitution.
        after_rubric:
          must:
          - A JupyterLab notebook window shows the markdown cell's eight bullet items with
            the document search overlay still open.
          - Every bullet item reads name= followed by its own three-digit number, then +1.
          must_not:
          - A blank page, an error overlay, or an unrelated application screen is shown.
          ignore:
          - Font antialiasing, caret blink, scrollbar rendering, window chrome, and the file
            browser's relative modification times.
      buggy:
        after: visual_lz-jupyterlab-16943-markdown-regex-replace-all/buggy.after.golden.png
        after_description: Every bullet item reads name= followed by a dollar sign, a one,
          a plus sign and a one, so the substitution's back-reference was written out literally
          instead of carrying the captured digits.
        after_rubric:
          must:
          - A JupyterLab notebook window shows the markdown cell's eight bullet items with
            the document search overlay still open.
          - Every bullet item reads name= followed by $1+1, and no three-digit number remains
            in any item.
          must_not:
          - A blank page, an error overlay, or an unrelated application screen is shown.
          ignore:
          - Font antialiasing, caret blink, scrollbar rendering, window chrome, and the file
            browser's relative modification times.
