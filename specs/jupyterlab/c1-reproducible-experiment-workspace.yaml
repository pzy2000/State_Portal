name: C1 JupyterLab reproducible experiment workspace
benchmark: jupyterlab
repo: ../../games/jupyterlab
timeout_ms: 900000
tags: [c1, long, jupyterlab, reproducibility]
target:
  kind: notebook
  path: c1/experiment.ipynb
  cells:
    - {cell_type: code, source: "import json, csv\nconfig = json.load(open('config.json'))\nrows = list(csv.DictReader(open('data.csv')))\nprint(f\"seed={config['seed']}; rows={len(rows)}\")\n"}
    - {cell_type: code, source: "x = [float(row['x']) for row in rows]\ny = [float(row['y']) for row in rows]\npred = [2 * value for value in x]\nprint('preprocess=complete; model=fixed-linear')\n"}
    - {cell_type: code, source: "mae = sum(abs(a-b) for a,b in zip(y,pred))/len(y)\nr2 = 1.0\nprint(f'MAE={mae:.0f}; R2={r2:.0f}')\n"}
    - {cell_type: code, source: "metrics = {'seed': config['seed'], 'MAE': mae, 'R2': r2}\nopen('metrics.json','w').write(json.dumps(metrics, sort_keys=True))\nopen('report.md','w').write('# Experiment report\\nseed=7, MAE=0, R2=1\\n')\nprint('artifacts=metrics.json,report.md')\n"}
checkpoint:
  allowed_strategies: [jupyterlab_workspace_api_validate]
  expected_validity: save-restorable
actions:
  - {type: jupyterlab_open_file, path: c1/experiment.ipynb}
  - {type: jupyterlab_edit_text_file, path: c1/config.json, content: "{\"seed\": 7}\n"}
  - {type: jupyterlab_edit_text_file, path: c1/data.csv, content: "x,y\n1,2\n2,4\n3,6\n4,8\n"}
  - {type: jupyterlab_run_notebook_cell, path: c1/experiment.ipynb, cell_index: 0}
  - {type: jupyterlab_run_notebook_cell, path: c1/experiment.ipynb, cell_index: 1}
  - {type: jupyterlab_run_notebook_cell, path: c1/experiment.ipynb, cell_index: 2}
  - {type: jupyterlab_run_notebook_cell, path: c1/experiment.ipynb, cell_index: 3}
  - {type: jupyterlab_set_workspace_layout, workspace: c1-experiment, paths: [c1/metrics.json, c1/report.md, c1/experiment.ipynb, c1/config.json, c1/data.csv]}
evaluation:
  schema_version: 1
  semantic:
    assertions:
      - {type: jupyterlab_notebook_output_contains, path: c1/experiment.ipynb, text: "seed=7; rows=4"}
      - {type: jupyterlab_notebook_output_contains, path: c1/experiment.ipynb, text: "MAE=0; R2=1"}
      - {type: jupyterlab_file_text_equals, path: c1/metrics.json, content: "{\"MAE\": 0.0, \"R2\": 1.0, \"seed\": 7}"}
      - {type: jupyterlab_file_text_equals, path: c1/report.md, content: "# Experiment report\nseed=7, MAE=0, R2=1\n"}
      - {type: jupyterlab_workspace_contains, workspace: c1-experiment, path: c1/config.json}
      - {type: jupyterlab_workspace_contains, workspace: c1-experiment, path: c1/data.csv}
      - {type: jupyterlab_workspace_contains, workspace: c1-experiment, path: c1/experiment.ipynb}
      - {type: jupyterlab_notebook_all_code_cells_executed, path: c1/experiment.ipynb}
      - {type: jupyterlab_notebook_has_no_error_outputs, path: c1/experiment.ipynb}
      - {type: no_jupyterlab_server_errors}
    surfaces:
      gui:
        adapter: jupyterlab_live_contents_v1
        start:
          validate_target: true
          checks: []
        goal:
          use_assertions: true
          checks: []
          requirements:
          -
            name: transition.changed_from_start
            probe: jupyter.changed_from_start
            metric: equals
            expected: true
            meaningful_assertions:
            - jupyterlab_file_text_equals
            - jupyterlab_notebook_output_contains
      state:
        adapter: jupyterlab_live_contents_v1
        goal:
          checks: []
          use_assertions: true
          requirements:
          - name: transition.changed_from_start
            probe: jupyter.changed_from_start
            metric: equals
            expected: true
            meaningful_assertions:
            - jupyterlab_file_text_equals
            - jupyterlab_notebook_output_contains
        start:
          checks: []
          validate_target: true
  visual_oracle:
    golden_image: visual/c1-reproducible-experiment-workspace.after.golden.png
    golden_before: visual/c1-reproducible-experiment-workspace.before.golden.png
    golden_after: visual/c1-reproducible-experiment-workspace.after.golden.png
    expected_label: correct
    description: The unexecuted experiment notebook is open before its task-sandbox inputs and result artifacts are created.
    after_description: Seed 7, MAE 0, R2 1, and the experiment artifact tabs are visible in the saved workspace.
    rubric:
      must: [The real JupyterLab shell and unexecuted experiment notebook are visible]
      must_not: [A server error or blank page is shown]
    after_rubric:
      must: [Seed 7 and perfect evaluation metrics are visible, Multiple experiment files are open or visible]
      must_not: [A traceback is visible, The notebook remains unexecuted]
    capture: {stage: post_smoke, wait_ms: 500, full_page: false}
