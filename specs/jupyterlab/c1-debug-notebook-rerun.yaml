name: C1 JupyterLab debug and rerun dependency chain
benchmark: jupyterlab
repo: ../../games/jupyterlab
timeout_ms: 900000
tags: [c1, long, jupyterlab, debug]
target:
  kind: notebook
  path: c1/currency-debug.ipynb
  cells:
    - {cell_type: code, source: "raw = ['$10', '$20', '$30', '$40']\nprint('source_rows=4')\n"}
    - {cell_type: code, source: "values = [float(value) for value in raw]\n"}
    - {cell_type: code, source: "total = sum(values)\nmean = total / len(values)\nprint(f'total={total:.0f}; mean={mean:.0f}')\n"}
    - {cell_type: code, source: "from IPython.display import display\ndisplay({'text/html': '<div id=\"currency-chart\">10 | 20 | 30 | 40</div>'}, raw=True)\nprint('chart=currency-bars')\n"}
checkpoint:
  allowed_strategies: [jupyterlab_workspace_api_validate]
  expected_validity: save-restorable
actions:
  - {type: jupyterlab_open_file, path: c1/currency-debug.ipynb}
  - type: jupyterlab_edit_notebook_cell
    path: c1/currency-debug.ipynb
    cell_index: 1
    source: "values = [float(value.replace('$', '')) for value in raw]\nprint('currency_parse=fixed')\n"
  - {type: jupyterlab_run_notebook_cell, path: c1/currency-debug.ipynb, cell_index: 0}
  - {type: jupyterlab_run_notebook_cell, path: c1/currency-debug.ipynb, cell_index: 1}
  - {type: jupyterlab_run_notebook_cell, path: c1/currency-debug.ipynb, cell_index: 2}
  - {type: jupyterlab_run_notebook_cell, path: c1/currency-debug.ipynb, cell_index: 3}
  - {type: jupyterlab_export_notebook_html, path: c1/currency-debug.ipynb, output_path: c1/currency-debug.html}
evaluation:
  schema_version: 1
  semantic:
    assertions:
      - type: jupyterlab_notebook_cell_source_equals
        path: c1/currency-debug.ipynb
        cell_index: 1
        source: "values = [float(value.replace('$', '')) for value in raw]\nprint('currency_parse=fixed')\n"
      - {type: jupyterlab_notebook_output_contains, path: c1/currency-debug.ipynb, text: "currency_parse=fixed"}
      - {type: jupyterlab_notebook_output_contains, path: c1/currency-debug.ipynb, text: "total=100; mean=25"}
      - {type: jupyterlab_notebook_all_code_cells_executed, path: c1/currency-debug.ipynb}
      - {type: jupyterlab_notebook_has_no_error_outputs, path: c1/currency-debug.ipynb}
      - {type: jupyterlab_file_exists, path: c1/currency-debug.html}
      - {type: no_jupyterlab_server_errors}
    surfaces:
      gui:
        adapter: jupyterlab_live_contents_v1
        start:
          validate_target: true
          checks: []
        goal:
          use_assertions: true
          checks: []
          requirements:
          -
            name: transition.changed_from_start
            probe: jupyter.changed_from_start
            metric: equals
            expected: true
            meaningful_assertions:
            - jupyterlab_file_text_equals
            - jupyterlab_notebook_output_contains
      state:
        adapter: jupyterlab_live_contents_v1
        goal:
          checks: []
          use_assertions: true
          requirements:
          - name: transition.changed_from_start
            probe: jupyter.changed_from_start
            metric: equals
            expected: true
            meaningful_assertions:
            - jupyterlab_file_text_equals
            - jupyterlab_notebook_output_contains
        start:
          checks: []
          validate_target: true
  visual_oracle:
    golden_image: visual/c1-debug-notebook-rerun.after.golden.png
    golden_before: visual/c1-debug-notebook-rerun.before.golden.png
    golden_after: visual/c1-debug-notebook-rerun.after.golden.png
    expected_label: correct
    description: The currency notebook is open before the faulty conversion cell is repaired.
    after_description: The repaired cell, total 100, mean 25, and successful chart output are visible without traceback.
    rubric:
      must: [The real JupyterLab shell and currency notebook are visible]
      must_not: [A blank or unrelated browser page is shown]
    after_rubric:
      must: [The total 100 and mean 25 output is visible, No traceback is visible]
      must_not: [The original currency conversion error remains, The notebook is unexecuted]
    capture: {stage: post_smoke, wait_ms: 500, full_page: false}
