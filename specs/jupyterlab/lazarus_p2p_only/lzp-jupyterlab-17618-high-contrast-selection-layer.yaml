        goal:
          use_assertions: true
          checks: []
  visual_oracle:
    golden_image: visual_lzp-jupyterlab-17618-high-contrast-selection-layer/before.golden.png
    description: 'A browser frame rendered by the candidate build shows a near-black panel on a dark page,
      holding the white line "select me" near its top left. The line sits directly on the panel: no band
      of any other shade is drawn behind it.'
    rubric:
      must:
      - A browser frame rendered by the candidate build shows a near-black panel on a dark page, holding
        the white line "select me" near its top left.
      - 'The line sits directly on the panel: no band of any other shade is drawn behind it.'
      must_not:
      - A blank page, an error overlay, or an unrelated application screen is shown.
      ignore:
      - Font antialiasing, caret blink, and sub-pixel text shifts.
  lazarus:
    schema_version: 1
    goal_checks:
    - id: rendered_goal_frame
      kind: visual_frame
      frame: fixed_after
      expected: A clearly lighter mid-grey band is drawn behind the line "select me", standing out plainly
        against the near-black panel around it.
    defect_signature:
    - id: rendered_defect_frame
      kind: visual_frame
      frame: buggy_after
      expected: The band drawn behind the line "select me" is the same near-black shade as the panel,
        so no band can be made out and the line looks unchanged from the start.
    invariant_checks:
    - id: shared_start_frame
      kind: visual_frame
      frame: before
      expected: 'The line sits directly on the panel: no band of any other shade is drawn behind it.'
    f2p_absence:
      reason: The defect is that one painted layer is indistinguishable from the surface behind it under
        one theme, because both resolve to the same colour. Every value involved is a stylesheet variable
        the document never reads, so the collision is observable only once painted.
      audited_paths: []
    upstream_tests:
