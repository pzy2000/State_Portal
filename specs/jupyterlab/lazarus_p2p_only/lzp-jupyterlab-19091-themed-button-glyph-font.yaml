        after_description: Two buttons are drawn. The second reads "WWWiii" in the same proportional interface
          typeface as the first, so its three W characters are much wider than its three i characters
          and the label runs narrower overall.
        after_rubric:
          must:
          - A browser frame rendered by the candidate build shows a white page holding a themed container
            with one or two large bordered buttons in a row near the top left.
          - Two buttons are drawn. The second reads "WWWiii" in the same proportional interface typeface
