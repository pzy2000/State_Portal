name: jynew battle team setup checkpoint
benchmark: "jynew"
tags: ["jynew", "battle", "team", "setup"]
target:
  kind: synthesized_state
  mod_id: JYX2
  player_level: 10
  team_ids: [0, 1, 2]
  skills:
    - id: 1
      level: 100
checkpoint:
  allowed_strategies: ["jynew_utility_save_validate"]
  expected_validity: "injection-only"
actions:
  - type: jynew_rest
assertions:
  - type: jynew_team_count
    expected: "3"
    comparator: equals
  - type: jynew_role_attr
    role_id: 0
    attr: Level
    expected: "10"
    comparator: equals
  - type: jynew_skill_learned
    role_id: 0
    skill_id: 1
  - type: jynew_role_attr
    role_id: 0
    attr: Tili
    expected: "30"
    comparator: gte
  - type: no_jynew_utility_errors
visual_oracle:
  golden_image: visual/battle-setup.golden.png
  expected_label: correct
  scene_key: jynew_default_world
  description: "After resting with a full 3-member team at level 10, the game world is rendered with the party ready for battle. Tili should be restored."
  rubric:
    must:
      - "The jynew 3D game world is rendered and visible."
      - "The player character is present in the scene."
      - "The game shows a normal exploration state (post-rest)."
    must_not:
      - "The screen is blank or in an error state."
      - "A battle scene is actively shown (rest should not trigger battle)."
      - "The game is crashed or unresponsive."
    ignore:
      - "Exact Tili value display (verified by assertions)."
      - "Whether party members are visually rendered nearby."
      - "Camera angle or environmental details."
  capture:
    stage: post_smoke
    wait_ms: 1000
    full_page: false
