# Quick Start subset of tasks_explore.yaml: the three 2048 tasks only, so the
# README sanity check needs just the games/2048 checkout. Task text is copied
# verbatim; grading reuses benchmarks/core/hidden/oracles.yaml.
tasks:
- id: 2048-merge-left
  benchmark: '2048'
  repo: games/2048
  issue: "Starting from a 2048 board with two 2 tiles in the top row and the score at 0, a single left move should merge them into a 4 and raise the score. The restored board is a 4x4 grid whose top row reads 2, 2, then two empty cells, and every remaining cell is empty; both the current score and the best score start at 0. From that state the checkpoint action is a single Left move. Read the game's own source to work out how it persists board state in the browser, then choose the matching WarpTest checkpoint strategy and the correct validity class so the restored board is verified to survive a page reload."
  tags:
  - core-synthesis
  - explore-hard
  - '2048'
  - merge
  budget_ms: 60000
- id: 2048-near-win
  benchmark: '2048'
  repo: games/2048
  issue: "Starting from a near-win 2048 board with two 1024 tiles in the top row, a single left move should produce a visible 2048 tile. The restored board is a 4x4 grid: the top row holds 1024, 1024, then two empty cells; the second row holds 4, 8, 16, 32; the bottom two rows are entirely empty. Both the current score and the best score are 4096. From that state the checkpoint action is a single Left move. Read the game's own source to work out how it persists board state in the browser, then choose the matching WarpTest checkpoint strategy and the correct validity class so the restored board is verified across a page reload."
  tags:
  - core-synthesis
  - explore-hard
  - '2048'
  - near-win
  budget_ms: 60000
- id: 2048-near-loss
  benchmark: '2048'
  repo: games/2048
  issue: "Starting from a terminal near-loss 2048 board, the restored board should stay in a game-over / no-moves condition. The board is a fully packed 4x4 grid in an alternating 2/4 checkerboard: rows one and three read 2, 4, 2, 4, while rows two and four read 4, 2, 4, 2. Both the current score and the best score are 512, and the board is already in a terminal game-over state (its over flag is true). From that state the checkpoint action is a single Left move, which must leave the game still over (over stays true). Read the game's own source to work out how it persists board state in the browser, then choose the matching WarpTest checkpoint strategy and the correct validity class so the restored board is verified across a page reload."
  tags:
  - core-synthesis
  - explore-hard
  - '2048'
  - near-loss
  budget_ms: 60000
