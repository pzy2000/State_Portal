tasks:
- id: 2048-merge-left
  benchmark: '2048'
  repo: games/2048
  issue: 'Starting from a 2048 board with two 2 tiles in the top row and the score at 0, a single left move should merge them into a 4 and raise the score. The restored board is a 4x4 grid whose top row reads 2, 2, then two empty cells, and every remaining cell is empty; both the current score and the best score start at 0. From that state the checkpoint action is a single Left move. Persist and verify the board through browser localStorage using the localStorage_restore_reload strategy, and the checkpoint should remain save-restorable across a reload.'
  tags:
  - core-synthesis
  - '2048'
  - merge
  budget_ms: 60000
- id: 2048-near-win
  benchmark: '2048'
  repo: games/2048
  issue: 'Starting from a near-win 2048 board with two 1024 tiles in the top row, a single left move should produce a visible 2048 tile. The restored board is a 4x4 grid: the top row holds 1024, 1024, then two empty cells; the second row holds 4, 8, 16, 32; the bottom two rows are entirely empty. Both the current score and the best score are 4096. From that state the checkpoint action is a single Left move. Persist and verify the board through browser localStorage using the localStorage_restore_reload strategy, and the checkpoint should remain save-restorable across a reload.'
  tags:
  - core-synthesis
  - '2048'
  - near-win
  budget_ms: 60000
- id: 2048-near-loss
  benchmark: '2048'
  repo: games/2048
  issue: 'Starting from a terminal near-loss 2048 board, the restored board should stay in a game-over / no-moves condition. The board is a fully packed 4x4 grid in an alternating 2/4 checkerboard: rows one and three read 2, 4, 2, 4, while rows two and four read 4, 2, 4, 2. Both the current score and the best score are 512, and the board is already in a terminal game-over state (its over flag is true). From that state the checkpoint action is a single Left move, which must leave the game still over (over stays true). Persist and verify the board through browser localStorage using the localStorage_restore_reload strategy, and the checkpoint should remain save-restorable across a reload.'
  tags:
  - core-synthesis
  - '2048'
  - near-loss
  budget_ms: 60000
- id: spacerpg-playable-flight
  benchmark: SpaceRPG
  repo: games/SpaceRPG
  issue: 'From a SpaceRPG start, the game should reach a playable Helion Reach flight state that still accepts throttle input. Run with the economy backend disabled. The checkpoint state is the flight screen in the helion-reach system, and it should still respond to throttle: the checkpoint action presses the W key. Reach and validate this state with the test_hook_jump_and_validate strategy; the checkpoint is replay-reachable.'
