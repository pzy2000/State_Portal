# State Loop MVP task set.
#
# New benchmark format for the "state-management driven Gen+Test loop":
#   Input  : state_description (a test-target description, like a test case) + repo.
#   Output : a checkpoint config (the method's generated_spec) -- config only, no source edit.
#   Eval   : run -> GUI screenshot_before / screenshot_after -> VS. Oracle goldens -> True/False.
#
# Each task reuses an existing core public-issue id so the deterministic offline agent
# (which keys templates by id) and the LLM exploration agent both produce a runnable
# config. `oracle_spec` points at the hidden ground-truth spec used ONLY by the grader
# to auto-generate the before/after golden screenshots (Repo_Oracle -> goldens).
#
# Scope: browser-backed profiles use warm browser state restore; Luanti and Blender
# use native before/after pair evaluation paths with engine-produced screenshots.
tasks:
  - id: 2048-merge-left
    benchmark: "2048"
    repo: games/2048
    state_description: >-
      Start from a 2048 board whose top row holds two 2 tiles with the score at 0,
      then a single left move must merge them into a 4 and raise the score.
      Tiles only move in response to the keyboard Left/Right/Up/Down arrow keys;
      clicking on the board does not move tiles.
    oracle_spec: specs/2048/merge-left.yaml
    tags: ["state-loop", "2048", "merge"]
    budget_ms: 60000
  - id: 2048-near-win
    benchmark: "2048"
    repo: games/2048
    state_description: >-
      Start from a near-win 2048 board carrying two 1024 tiles in the top row,
      then a single left move must produce a visible 2048 tile.
      Tiles only move in response to the keyboard Left/Right/Up/Down arrow keys;
      clicking on the board does not move tiles.
    oracle_spec: specs/2048/near-win.yaml
    tags: ["state-loop", "2048", "near-win"]
    budget_ms: 60000
  - id: spacerpg-playable-flight
    benchmark: "SpaceRPG"
    repo: games/SpaceRPG
    state_description: >-
      Reach a playable Helion Reach flight state where the flight screen is rendered
      and the ship still accepts throttle input.
    oracle_spec: specs/spacerpg/playable-flight.yaml
