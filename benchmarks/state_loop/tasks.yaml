    benchmark: "DatingSim"
    repo: games/DatingSim
    state_description: >-
      Reach a seeded DatingSim state where a deterministic coding work action can
      change money and energy without any real AI calls.
    oracle_spec: specs/love/resource-action.yaml
    tags: ["state-loop", "love", "resources"]
    budget_ms: 90000
