# Pre-registered C1 task universe shared by the formal C/D/E arms.
# Historical A/B entries remain disabled in the experiment manifest.
#
# The v5 public contract separates checkpoint preconditions from reference
# steps. ``state_description`` is their exact canonical concatenation.
# Historical goal text remains commented for editors only; it is neither parsed
# nor exposed to Agent-S. Hidden assertions and visual after-state rubrics are
# the formal success contract.
#
# Budgets are uniform across all 61 tasks: every task gets the same 100 decision
# steps and the same ``budget_ms``. They are not functions of benchmark, horizon
# or task, so a horizon-grouped result is never just a benchmark-grouped result
# in disguise. ``horizon_class`` is retained as a descriptive label only and does
# not influence any execution parameter.
