capability_vocabulary:
  multi-step-planning:
    description: Execute an ordered dependency chain whose later operations rely on earlier state changes.
    minimum_tasks: 3
    minimum_benchmarks: 2
  gui-localization:
    description: Locate and operate named controls, objects, regions, or panels in the rendered interface.
    minimum_tasks: 3
    minimum_benchmarks: 2
  state-persistence:
    description: Save, reload, reopen, or otherwise preserve state across a persistence boundary.
    minimum_tasks: 3
    minimum_benchmarks: 2
  numeric-reasoning:
    description: Track exact values, counts, arithmetic effects, thresholds, or formulas.
    minimum_tasks: 3
    minimum_benchmarks: 2
  spatial-reasoning:
    description: Reason about direction, coordinates, board layout, scene placement, or navigation.
    minimum_tasks: 3
    minimum_benchmarks: 2
  resource-management:
    description: Manage money, energy, inventory, cargo, units, production, or other consumable resources.
    minimum_tasks: 3
    minimum_benchmarks: 2
  structured-artifact-editing:
    description: Create or modify a structured world, notebook, document, presentation, or 3D scene.
    minimum_tasks: 3
    minimum_benchmarks: 2
