      timeout_s: 3600

  - id: luanti
    family: lua_worldmod_extension
    remote: https://github.com/luanti-org/luanti.git
    clean_commit: ce65f0dc5a82ee4a62d6b64c83da3196908f98ea
    capability_brief: >-
      Add a test-only worldmod that writes and reads registered voxel nodes and
      mod storage in an isolated world. A save_reload request must stop and
      restart the server or client and observe the persisted values again.
    runtime_notes: CMake, Lua tooling, and Luanti server/client build dependencies are available.
    prepare: []
    checks:
      build:
        argv: ["{python}", "{harness_root}/scripts/run_hook_onboarding_build.py", "--app", "luanti", "--repo", "{repo}", "--report-dir", "{report_dir}"]
        timeout_s: 2100
        env:
          WARPTEST_ONBOARDING_BUILD_DIR: "{report_dir}/luanti-build"
    driver_env: {}
    development_smoke:
      id: development-smoke
      roundtrip: save_reload
      timeout_s: 600
      target: &luanti_dev
        nodes: [{pos: {x: 1, y: 1, z: 1}, node: basenodes:dirt}]
      expected: *luanti_dev
    held_out:
      - id: heldout-a
        roundtrip: save_reload
        timeout_s: 600
        target: &luanti_a
          nodes: [{pos: {x: 2, y: 1, z: 2}, node: basenodes:dirt}]
        expected: *luanti_a
      - id: heldout-b
        roundtrip: save_reload
        timeout_s: 600
        target: &luanti_b
          mod_storage: [{key: warptest_progress, value: chapter-2}]
        expected: *luanti_b
    reference:
      argv: ["{python}", "{harness_root}/scripts/run_hook_onboarding_reference.py", "--manifest", "{harness_root}/benchmarks/onboarding/manifest.yaml", "--app", "luanti", "--repo", "{repo}", "--report-dir", "{report_dir}"]
      timeout_s: 3600
