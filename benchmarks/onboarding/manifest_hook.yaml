  libreoffice:
    runtime_notes: Use the public Java UNO bridge with an isolated LibreOffice user profile and no GUI
      automation. The exact executable is provided in WARPTEST_ONBOARDING_SOFFICE and the matching public
      aggregate UNO JAR is provided in WARPTEST_ONBOARDING_LIBREOFFICE_JAR; use these variables directly
      and do not search parent directories. Start soffice with a unique localhost UNO accept socket, wait
      until that socket is ready, and connect with the Java UNO URL resolver. Remote UNO transport threads
      can remain non-daemon after the requested document is closed, so ensure a successful Java helper
      exits explicitly after it has written the observed result. The host Python 3.13 pyuno ABI is incompatible.
    driver_env:
      WARPTEST_ONBOARDING_SOFFICE: '{harness_root}/games/LibreOffice/instdir/LibreOfficeDev.app/Contents/MacOS/soffice'
      WARPTEST_ONBOARDING_LIBREOFFICE_JAR: '{harness_root}/games/LibreOffice/instdir/LibreOfficeDev.app/Contents/Resources/java/libreoffice.jar'
    reference:
      argv:
      - '{python}'
      - '{harness_root}/scripts/run_hook_onboarding_reference.py'
      - --manifest
      - '{harness_root}/benchmarks/onboarding/manifest_hook.yaml'
      - --app
      - libreoffice
      - --repo
      - '{repo}'
      - --report-dir
      - '{report_dir}'
      timeout_s: 1800
    development_suite:
    - id: development-smoke
      roundtrip: save_reload
      timeout_s: 240
      target:
        kind: writer_document
        path: development.odt
        paragraphs:
        - text: Development Smoke
          style: Heading 1
        - text: roundtrip
      expected:
        kind: writer_document
        path: development.odt
        paragraphs:
        - text: Development Smoke
          style: Heading 1
        - text: roundtrip
    - id: development-live-writer
      roundtrip: live
      timeout_s: 240
      target:
        kind: writer_document
        path: development-live.odt
        paragraphs:
        - text: Visible Writer
        - text: live-read
      expected:
