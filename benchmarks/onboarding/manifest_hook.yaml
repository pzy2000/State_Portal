    development_suite:
    - id: development-smoke
      roundtrip: save_reload
      timeout_s: 240
      target:
        kind: text_file
        path: notes/development.txt
        content: development-smoke
      expected:
        kind: text_file
        path: notes/development.txt
        content: development-smoke
    - id: development-live-nested-text
      roundtrip: live
      timeout_s: 240
      target:
        kind: text_file
        path: nested/visible/live.txt
        content: 'visible live text

          line two'
      expected:
        kind: text_file
        path: nested/visible/live.txt
        content: 'visible live text

          line two'
    - id: development-reload-notebook-shorthand
      roundtrip: save_reload
      timeout_s: 300
      target:
        kind: notebook
        path: notebooks/development-v2.ipynb
        cells:
        - cell_type: markdown
          source:
          - '# Visible notebook'
        - cell_type: code
          source:
          - 'answer = 7

            '
          - answer
      expected:
