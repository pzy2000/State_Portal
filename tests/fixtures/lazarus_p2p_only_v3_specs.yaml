lzp-jupyterlab-17153-shortcut-chip-contrast:
  spec:
    schema_version: 1
    benchmark: jupyterlab
    target:
      kind: p2p_only_state
      state:
        component: shortcut_chip
        theme: dark
        props:
          text: Ctrl A
          class_name: ''
    checkpoint:
      allowed_strategies:
      - p2p_only_typed_restore_v3
      expected_validity: injection-only
    actions:
    - type: set_class
      selector: '#line'
      class_name: jp-mod-selected-InputText
    assertions: []
  pixel_actions: []
